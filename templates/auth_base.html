<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}GuardOps{% endblock %} | GuardOps</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f4f5fa;
        --pri: #696cff;
        --pri2: #7367f0;
        --sh: 0 2px 6px rgba(67, 89, 113, 0.12);
        --bs-body-bg: #f4f5fa;
        --bs-body-color: #566a7f;
        --bs-primary: #696cff;
        --bs-primary-rgb: 105, 108, 255;
        --bs-link-color: #696cff;
        --bs-border-radius: 0.5rem;
        --bs-body-font-family: "Public Sans", system-ui, sans-serif;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        color: #384551;
        font-weight: 600;
      }
      .btn-primary {
        --bs-btn-bg: #696cff;
        --bs-btn-border-color: #696cff;
        --bs-btn-hover-bg: #5f61e6;
        --bs-btn-hover-border-color: #5f61e6;
        --bs-btn-active-bg: #5456cc;
        --bs-btn-active-border-color: #5456cc;
        box-shadow: 0 2px 4px rgba(105, 108, 255, 0.4);
      }
      .btn-outline-primary {
        --bs-btn-color: #696cff;
        --bs-btn-border-color: #696cff;
        --bs-btn-hover-bg: #696cff;
        --bs-btn-hover-border-color: #696cff;
        --bs-btn-active-bg: #5456cc;
      }
      .form-control:focus,
      .form-select:focus,
      .form-check-input:focus {
        border-color: #696cff;
        box-shadow: 0 0 0 0.2rem rgba(105, 108, 255, 0.2);
      }
      .form-check-input:checked {
        background-color: #696cff;
        border-color: #696cff;
      }
      .card {
        border: 0;
        border-radius: 0.5rem;
        box-shadow: var(--sh);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-size: 1.5rem;
        font-weight: 700;
        color: #384551;
        text-decoration: none;
      }
      .brand i {
        font-size: 2rem;
        color: var(--pri);
      }
      .icon-badge {
        width: 46px;
        height: 46px;
        border-radius: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        flex-shrink: 0;
      }
      .bg-label-primary {
        background: #e7e7ff !important;
        color: #696cff !important;
      }
      .bg-label-success {
        background: #e8fadf !important;
        color: #71dd37 !important;
      }
      .bg-label-danger {
        background: #ffe0db !important;
        color: #ff3e1d !important;
      }
      .bg-label-warning {
        background: #fff2d6 !important;
        color: #ffab00 !important;
      }
      .bg-label-info {
        background: #d7f5fc !important;
        color: #03c3ec !important;
      }
      .auth-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        position: relative;
        overflow: hidden;
      }
      .auth-wrap::before,
      .auth-wrap::after {
        content: "";
        position: absolute;
        width: 380px;
        height: 380px;
        border-radius: 50%;
        background: rgba(105, 108, 255, 0.12);
        z-index: 0;
      }
      .auth-wrap::before {
        top: -140px;
        left: -120px;
      }
      .auth-wrap::after {
        bottom: -160px;
        right: -120px;
        background: rgba(3, 195, 236, 0.1);
      }
      .auth-card {
        position: relative;
        z-index: 1;
        width: 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
